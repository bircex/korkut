[project]
name = "korkut"
version = "0.1.0"
description = "Korkut — AI assistant for a law office over a self-hosted chat UI (single identity, specialty modules)"
requires-python = ">=3.12"
readme = "README.md"
license = { file = "LICENSE" }

dependencies = [
    "httpx>=0.28",
    "pyyaml>=6.0.3",
    "markdownify>=1.2",
    "pypdf>=6.14",
]

[project.optional-dependencies]
# Runtime modules beyond the tools layer (added in later phases).
app = [
    "anthropic>=0.111",
    "openai>=2.43",
    "fastapi>=0.138",
    "uvicorn[standard]>=0.49",
    "python-multipart>=0.0.32",
    "segno>=1.6.6",
    "psycopg[binary]>=3.3",
    "python-docx>=1.2",
    "pypdf>=6.14",
    "pytesseract>=0.3.13",
    "Pillow>=12.0",
    "SQLAlchemy>=2.0.51",
]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "respx>=0.23",
    "ruff>=0.15",
    "SQLAlchemy>=2.0.51",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "tools", "web", "korkut"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: hits real external endpoints (deselected by default; run with -m live)",
]
addopts = "-m 'not live'"

[tool.coverage.run]
source = ["tools", "core", "web", "korkut"]
omit = ["*/__main__.py", "tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
