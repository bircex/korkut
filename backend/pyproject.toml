[project]
name = "korkut"
version = "0.1.0"
description = "Korkut — AI assistant for a law office over a self-hosted chat UI"
requires-python = ">=3.12"
# README and LICENSE live at the repository root (one level up from this backend package).

dependencies = [
    "httpx>=0.28",
    "pyyaml>=6.0.3",
    "markdownify>=1.2",
    "pypdf>=6.14",
]

[project.optional-dependencies]
# Runtime modules beyond the tools layer (added in later phases).
app = [
    "anthropic>=0.111",
    "openai>=2.43",
    "fastapi>=0.138",
    "uvicorn[standard]>=0.49",
    "python-multipart>=0.0.32",
    "segno>=1.6.6",
    "psycopg[binary]>=3.3",
    "python-docx>=1.2",
    "pypdf>=6.14",
    "pytesseract>=0.3.13",
    "Pillow>=12.0",
    "SQLAlchemy>=2.0.51",
]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "respx>=0.23",
    "ruff>=0.15",
    "mypy>=2.1",
    "SQLAlchemy>=2.0.51",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: hits real external endpoints (deselected by default; run with -m live)",
]
addopts = "-m 'not live'"

[tool.coverage.run]
source = ["korkut"]
omit = ["*/__main__.py", "tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PIE",  # flake8-pie
    "TID",  # flake8-tidy-imports
    "PT",   # flake8-pytest-style
    "RUF",  # ruff-specific
]
ignore = [
    # Ambiguous-Unicode checks flag legitimate Turkish letters (ı, ş, ç, …).
    # This is a Turkish-language legal app; these are false positives.
    "RUF001",
    "RUF002",
    "RUF003",
    # Intentional, descriptive exception names (RateLimited, RejectedFile, …).
    "N818",
    # FastAPI uses callables (File(), Depends(), …) in parameter defaults by design.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# Tests favour readable compound asserts, broad `pytest.raises`, and asserting on
# caught exceptions.
"tests/*" = ["PT011", "PT017", "PT018"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src/korkut/core", "src/korkut/tools", "src/korkut/brain"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
