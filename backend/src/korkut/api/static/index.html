<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <!-- Tema attribute'u ilk boyamadan önce yazılır (FOUC önlenir); esas mantık src/theme.ts. -->
    <script>
      (function () {
        try {
          var m = localStorage.getItem("korkut:theme") || "light";
          var dark =
            m === "dark" ||
            (m !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f4f5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#17171a" />
    <link rel="icon" type="image/svg+xml" href="/korkut-logo.svg" />
    <title>Korkut</title>
    <script type="module" crossorigin src="/assets/index-BFicPZhe.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-Cmh2jah1.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
