name: fetch_decision
description: >
  Fetch the full text of a court decision as Markdown via the Bedesten API. Works for any
  Bedesten-sourced decision (Yargıtay, Danıştay, local, appellate, KYB). The documentId comes
  from a search_yargitay / search_danistay / search_emsal result. Use this to verify a
  citation actually exists before relying on it.
requires_key: null
parameters:
  document_id:
    type: string
    required: true
    description: The documentId returned by a search_* tool.
