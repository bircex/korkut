name: fetch_sigorta_tahkim
description: >
  Fetch a Sigorta Tahkim Komisyonu (Insurance Arbitration Commission) journal issue ("Hakem Karar
  Dergisi") as Markdown, given the issue number from a search_sigorta_tahkim result. Journals are
  large, so the text is paginated. Returns {issueNumber, sourceUrl, markdown, page, total_pages}.
  No API key.
requires_key: null
parameters:
  issue_number:
    type: string
    required: true
    description: The journal issue number from a search_sigorta_tahkim result's `id` field.
  page:
    type: integer
    required: false
    default: 1
    description: 1-indexed page of the chunked Markdown.
  page_size:
    type: integer
    required: false
    default: 5000
    description: Characters per page.
