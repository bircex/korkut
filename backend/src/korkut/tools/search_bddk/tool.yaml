name: search_bddk
description: >
  Search BDDK (Bankacılık Düzenleme ve Denetleme Kurumu / Banking Regulation and Supervision
  Authority) decisions. BDDK publishes documents on bddk.org.tr with no searchable API, so
  discovery uses the Tavily Search API restricted to the BDDK document domain. Returns decision
  metadata (id, title, content snippet, url); use fetch_bddk with an id for full text.
  Requires a Tavily API key (TAVILY_API_KEY).
requires_key: TAVILY_API_KEY
parameters:
  query:
    type: string
    required: true
    description: Free-text keywords (Turkish).
  limit:
    type: integer
    required: false
    default: 10
    description: Maximum results (1-20). Tavily has no real pagination; pages > 1 may be empty.
  page:
    type: integer
    required: false
    default: 1
    description: 1-indexed page number (kept for envelope consistency).
