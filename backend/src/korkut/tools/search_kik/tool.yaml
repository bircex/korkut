name: search_kik
description: >
  Search KİK (Kamu İhale Kurulu / Public Procurement Authority) board decisions via the
  official kik.gov.tr v2 API. The v2 API exposes three decision families at separate
  endpoints — disputes (uyusmazlik), regulatory (duzenleyici), and court (mahkeme) — selected
  with decision_type. Returns decision metadata (id, subject, date, document URL). No API key.
requires_key: null
parameters:
  query:
    type: string
    required: true
    description: Free-text search over decision content (KararMetni). May be empty to list recent decisions.
  decision_type:
    type: string
    required: false
    default: uyusmazlik
    description: >
      Decision family. One of: "uyusmazlik" (disputes, GetKurulKararlari),
      "duzenleyici" (regulatory, GetKurulKararlariDk), "mahkeme" (court, GetKurulKararlariMk).
  limit:
    type: integer
    required: false
    default: 10
    description: Results per page (>= 1).
  page:
    type: integer
    required: false
    default: 1
    description: 1-indexed page number.
  karar_no:
    type: string
    required: false
    description: Optional decision number, e.g. "2025/UH.II-1801".
  basvuran:
    type: string
    required: false
    description: Optional applicant name (BasvuranAdi).
  idare_adi:
    type: string
    required: false
    description: Optional administration / procuring-entity name (IdareAdi).
  date_start:
    type: string
    required: false
    description: Optional start date, YYYY-MM-DD.
  date_end:
    type: string
    required: false
    description: Optional end date, YYYY-MM-DD.
