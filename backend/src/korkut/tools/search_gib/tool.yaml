name: search_gib
description: >
  Search GİB (Gelir İdaresi Başkanlığı / Revenue Administration) tax rulings (özelge) and the
  tax legislation they reference, via the official gib.gov.tr JSON API. Özelgeler are official
  ruling letters answering taxpayer questions on VAT, income tax, corporate tax, stamp duty and
  similar matters. Returns ruling metadata (id, title, date, source URL). No API key.
requires_key: null
parameters:
  query:
    type: string
    required: true
    description: >
      Free-text search phrase (Turkish). Matched across the ruling title, its referenced law
      number and its body text.
  limit:
    type: integer
    required: false
    default: 10
    description: Results per page (1-50).
  page:
    type: integer
    required: false
    default: 1
    description: 1-indexed page number.
