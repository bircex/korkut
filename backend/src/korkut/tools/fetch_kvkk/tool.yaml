name: fetch_kvkk
description: >
  Fetch the full text of a KVKK (Personal Data Protection Authority) board decision as Markdown,
  given the decision URL from a search_kvkk result. Long decisions are paginated. Returns
  {sourceUrl, title, date, decisionNumber, markdown, page, total_pages}. No API key.
requires_key: null
parameters:
  decision_url:
    type: string
    required: true
    description: Full decision URL from a search_kvkk result's `url` field (a kvkk.gov.tr address).
  page:
    type: integer
    required: false
    default: 1
    description: 1-indexed page of the chunked Markdown.
  page_size:
    type: integer
    required: false
    default: 5000
    description: Characters per page.
