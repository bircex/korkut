name: search_uyusmazlik
description: >
  Search Uyuşmazlık Mahkemesi (Court of Jurisdictional Disputes) decisions via the official
  kararlar.uyusmazlik.gov.tr portal. This court resolves jurisdiction (görev) and judgment
  (hüküm) conflicts between the judicial and administrative court orders. Returns decision
  metadata (id, case number, decision number, date, PDF url). Use fetch_uyusmazlik with a
  result's url for the full text. No API key.
requires_key: null
parameters:
  query:
    type: string
    required: true
    description: Search text.
  scope:
    type: string
    required: false
    default: all
    description: >
      Where to match. One of "all" (default, full content), "esas" (case number),
      "karar" (decision number).
  limit:
    type: integer
    required: false
    default: 10
    description: Results to return from the page (the portal serves 20 per page).
  page:
    type: integer
    required: false
    default: 1
    description: 1-indexed page number (server-side paging is walked to this page).
  case_sensitive:
    type: boolean
    required: false
    default: false
    description: Match case exactly when true.
