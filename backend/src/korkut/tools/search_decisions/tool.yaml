name: search_decisions
description: >
  Search Turkish public legal databases. Choose `source` for the right corpus, then `query`.
  Returns result metadata (ids, dates, case/decision numbers); pass an id to fetch_document for
  the full text. One tool for every corpus — pick the source that matches the legal question.
requires_key: null
# Replaces the 14 per-source search_* tools in the model's offered set; they remain runnable and
# this tool dispatches to them by `source`.
supersedes:
  - search_yargitay
  - search_danistay
  - search_emsal
  - search_kyb
  - search_anayasa
  - search_bddk
  - search_kvkk
  - search_sigorta_tahkim
  - search_gib
  - search_mevzuat
  - search_rekabet
  - search_sayistay
  - search_kik
  - search_uyusmazlik
parameters:
  source:
    type: string
    required: true
    options:
      - yargitay
      - danistay
      - emsal
      - kyb
      - anayasa
      - bddk
      - kvkk
      - sigorta_tahkim
      - gib
      - mevzuat
      - rekabet
      - sayistay
      - kik
      - uyusmazlik
    description: >
      Corpus to search: yargitay (Court of Cassation — civil/criminal), danistay (Council of
      State — administrative), emsal (UYAP precedent), kyb (kanun yararına bozma), anayasa
      (Constitutional Court), bddk (banking regulator), kvkk (data-protection authority),
      sigorta_tahkim (insurance arbitration), gib (tax/revenue), mevzuat (legislation),
      rekabet (competition authority), sayistay (Court of Accounts), kik (public-procurement
      authority), uyusmazlik (jurisdictional-disputes court).
  query:
    type: string
    required: true
    description: >
      Search phrase. Supports "exact phrase" (double quotes), +required, -exclude, and
      AND/OR/NOT operators. No wildcards or regex.
  limit:
    type: integer
    required: false
    default: 10
    description: Results per page (1-10).
  page:
    type: integer
    required: false
    default: 1
    description: 1-indexed page number.
  date_start:
    type: string
    required: false
    description: Start date YYYY-MM-DD. Applies to yargitay, danistay, emsal, kyb, kik.
  date_end:
    type: string
    required: false
    description: End date YYYY-MM-DD. Same sources as date_start.
  chamber:
    type: string
    required: false
    description: Chamber/daire filter, e.g. "1. Hukuk Dairesi". Applies to yargitay, danistay.
  decision_type:
    type: string
    required: false
    description: Decision-type filter. Applies to rekabet, sayistay, kik.
  legislation_type:
    type: string
    required: false
    description: Type filter for mevzuat (e.g. kanun, yönetmelik, tüzük).
  application_type:
    type: string
    required: false
    description: Application-type filter for anayasa (e.g. bireysel başvuru).
  scope:
    type: string
    required: false
    description: Scope filter for uyusmazlik.
  case_sensitive:
    type: boolean
    required: false
    description: Case-sensitive matching. Applies to uyusmazlik.
  karar_no:
    type: string
    required: false
    description: Decision-number filter. Applies to kik.
  basvuran:
    type: string
    required: false
    description: Applicant (başvuran) filter. Applies to kik.
  idare_adi:
    type: string
    required: false
    description: Contracting-authority (idare adı) filter. Applies to kik.
