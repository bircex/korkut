# Korkut is a single AI assistant identity, served through the self-hosted web chat UI.
# Each law office self-registers (becoming its own tenant); the office name is set at
# registration and drives Korkut's persona at runtime (see docs/ARCHITECTURE.md §7).
assistant:
  name: "Korkut"
persona: backend/src/korkut/brain/persona.py   # build_persona(office_name) — identity is per-office
