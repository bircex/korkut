# Cloudflare Workers static-assets deploy config (Workers Builds runs `npm run build`
# then `wrangler deploy`). Without this file wrangler finds no worker script and falls
# back to an interactive "astro add cloudflare" bootstrap — which installs the SSR
# adapter this static site doesn't need and fails in the non-interactive build sandbox.
# This is a pure static-assets Worker: no `main` script, just serve `dist/`.
name = "korkut-website"
compatibility_date = "2026-08-07"

[assets]
directory = "./dist"
