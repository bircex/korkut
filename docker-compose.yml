# Korkut, installed locally: run ./install.sh (install.ps1 on Windows), which writes the model
# gateway's secrets to .env once and starts the stack (a release pulls the published images
# named below, a source checkout builds them); then open
# http://localhost:8090. Every other setting has a local default, and the app's own secrets are
# generated on first start.
#
# One `korkut` container serves the whole app on :8090 (KORKUT_HTTP_PORT). Beside it,
# ocr and kikproxy are internal helpers with native or TLS needs of their own, and llmr is the
# gateway every AI model call goes through. One Postgres
# cluster holds the three schemas (operational / korkut_agent / korkut_knowledge); PgBouncer
# (transaction pooling) fronts it for the app, while the one-shot migrator connects directly
# (session mode) to apply schema. Grafana LGTM is optional (`--profile ops`). Secrets and
# provider keys come from a .env file the operator supplies (see .env.example); nothing is
# baked into an image.

name: korkut

x-app-env: &app-env
  # Unset = generated on first start into the `secrets` volume and reused (see LocalSecrets).
  KORKUT_SECRET: ${KORKUT_SECRET:-}
  # Empty = no telemetry export. With `--profile ops`, set it to http://lgtm:4317 in .env.
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  ASPNETCORE_ENVIRONMENT: Production

services:
  postgres:
    image: pgvector/pgvector:pg16
    # Headroom above the pgbouncer pool (50 + reserve) for the direct admin/migrator connections and
    # future host replicas; the default 100 is tight once the pool grows.
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-korkut-local}
      POSTGRES_DB: korkut
      KORKUT_APP_DB_PASSWORD: ${KORKUT_APP_DB_PASSWORD:-korkut-app-local}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/10-init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d korkut"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p2
    environment:
      DB_HOST: postgres
      DB_NAME: korkut
      DB_USER: korkut_app
      DB_PASSWORD: ${KORKUT_APP_DB_PASSWORD:-korkut-app-local}
      # The runtime hosts connect to pgbouncer:6432 (KORKUT_DB_URL); the edoburu image
      # otherwise listens on 5432, so pin the pooler's listen port to match.
      LISTEN_PORT: "6432"
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: "1000"
      # Server-side pool to Postgres. Turns hold connections only for short read/write bursts now
      # (the model loop runs outside any transaction), so this many backends serve far more concurrent
      # turns. Keep DEFAULT_POOL_SIZE + RESERVE below Postgres max_connections.
      DEFAULT_POOL_SIZE: "50"
      MIN_POOL_SIZE: "10"
      RESERVE_POOL_SIZE: "10"
      RESERVE_POOL_TIMEOUT: "3"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # One-shot: applies every schema (operational + agent + knowledge) as the superuser, then exits.
  migrator:
    # A release pulls this image (KORKUT_VERSION in .env); a source checkout builds it.
    image: ghcr.io/bircex/korkut-migrator:${KORKUT_VERSION:-local}
    build:
      context: .
      dockerfile: docker/Dockerfile.migrator
      args:
        KORKUT_VERSION: ${KORKUT_VERSION:-local}
    environment:
      KORKUT_ADMIN_DB_URL: postgres://postgres:${POSTGRES_PASSWORD:-korkut-local}@postgres:5432/korkut
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Observability backend: OTLP in (4317/4318), Grafana out (:3000). A dev/small-team default;
  # swap for a full LGTM/Seq cluster by pointing OTEL_EXPORTER_OTLP_ENDPOINT elsewhere.
  lgtm:
    image: grafana/otel-lgtm:0.8.1
    # Optional: `docker compose --profile ops up -d`, then point OTEL_EXPORTER_OTLP_ENDPOINT here.
    profiles: [ops]
    ports:
      - "${KORKUT_GRAFANA_PORT:-3000}:3000"
    restart: unless-stopped

  # The app: the API, the assistant, the knowledge index and the React app from ui/, in one
  # process on one origin (session cookies and the Google OAuth callback stay same-origin).
  korkut:
    # A release pulls this image (KORKUT_VERSION in .env); a source checkout builds it.
    image: ghcr.io/bircex/korkut:${KORKUT_VERSION:-local}
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      args:
        KORKUT_VERSION: ${KORKUT_VERSION:-local}
    environment:
      <<: *app-env
      KORKUT_DB_URL: postgres://korkut_app:${KORKUT_APP_DB_PASSWORD:-korkut-app-local}@pgbouncer:6432/korkut
      KORKUT_TOTP_KEY: ${KORKUT_TOTP_KEY:-}
      # Uploaded documents live on the `objects` volume. Set KORKUT_STORAGE=s3 plus the
      # KORKUT_MINIO_* variables to keep them in an S3-compatible server instead.
      KORKUT_STORAGE: ${KORKUT_STORAGE:-filesystem}
      KORKUT_MINIO_ENDPOINT: ${KORKUT_MINIO_ENDPOINT:-}
      KORKUT_MINIO_ACCESS_KEY: ${KORKUT_MINIO_ACCESS_KEY:-}
      KORKUT_MINIO_SECRET_KEY: ${KORKUT_MINIO_SECRET_KEY:-}
      KORKUT_MINIO_SECURE: ${KORKUT_MINIO_SECURE:-}
      # Scanned uploads (no text layer) are recognised by the OCR host; without this the extractor
      # is text-layer only and a scanned dilekçe reaches the model as "metin çıkarılamadı".
      KORKUT_OCR_URL: http://ocr:8080
      KORKUT_KIK_PROXY_URL: http://kikproxy:8080
      # The installation admin (korkut-admin), created on first start; see install.sh.
      KORKUT_ADMIN_PASSWORD: ${KORKUT_ADMIN_PASSWORD:?KORKUT_ADMIN_PASSWORD is not set; run ./install.sh}
      KORKUT_ADMIN_PASSWORD_RESET: ${KORKUT_ADMIN_PASSWORD_RESET:-}
      KORKUT_OFFICE_NAME: ${KORKUT_OFFICE_NAME:-}
      # Transactional e-mail: single operator SMTP account. Unset -> mail is logged, not sent.
      KORKUT_SMTP_HOST: ${KORKUT_SMTP_HOST:-smtp.gmail.com}
      KORKUT_SMTP_PORT: ${KORKUT_SMTP_PORT:-587}
      KORKUT_SMTP_USER: ${KORKUT_SMTP_USER:-}
      KORKUT_SMTP_PASSWORD: ${KORKUT_SMTP_PASSWORD:-}
      KORKUT_SMTP_FROM: ${KORKUT_SMTP_FROM:-}
      KORKUT_SMTP_FROM_NAME: ${KORKUT_SMTP_FROM_NAME:-Korkut}
      KORKUT_APP_URL: ${KORKUT_APP_URL:-}
      # Behind a reverse proxy: Secure cookies over HTTPS, and the proxy's real-client header.
      KORKUT_SECURE_COOKIES: ${KORKUT_SECURE_COOKIES:-}
      KORKUT_CLIENT_IP_HEADER: ${KORKUT_CLIENT_IP_HEADER:-}
      # Every model call goes through the gateway; which models answer is chosen in the app's
      # AI settings (Ayarlar → Yapay zeka), not here.
      KORKUT_LLMR_URL: http://llmr:8080
      KORKUT_LLMR_TOKEN: ${LLMR_TOKEN:-}
      KORKUT_OFFICE_TOKEN_BUDGET: ${KORKUT_OFFICE_TOKEN_BUDGET:-0}
      KORKUT_OFFICE_CONCURRENCY: ${KORKUT_OFFICE_CONCURRENCY:-0}
      KORKUT_MAX_TOKENS: ${KORKUT_MAX_TOKENS:-8192}
    # This machine only by default; set KORKUT_BIND_ADDRESS=0.0.0.0 to open it to the network.
    ports:
      - "${KORKUT_BIND_ADDRESS:-127.0.0.1}:${KORKUT_HTTP_PORT:-8090}:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
      llmr:
        condition: service_healthy
    volumes:
      - objects:/var/lib/korkut/objects
      - secrets:/var/lib/korkut/secrets
    restart: unless-stopped

  ocr:
    # A release pulls this image (KORKUT_VERSION in .env); a source checkout builds it.
    image: ghcr.io/bircex/korkut-ocr:${KORKUT_VERSION:-local}
    build:
      context: .
      dockerfile: docker/Dockerfile.ocr
      args:
        KORKUT_VERSION: ${KORKUT_VERSION:-local}
    environment:
      <<: *app-env
      # The image ships the native binaries (tesseract + poppler), but the host defaults to the
      # in-code scaffold that answers 503 — this flag is what activates the real engine.
      KORKUT_OCR_ENGINE: ${KORKUT_OCR_ENGINE:-tesseract}
      KORKUT_OCR_LANGS: ${KORKUT_OCR_LANGS:-tur+eng}
    # Validates the tokens the app forwards, so it reads the same generated secret.
    volumes:
      - secrets:/var/lib/korkut/secrets
    restart: unless-stopped

  # Single-purpose sidecar for the KİK (Kamu İhale Kurulu) source: ekap.kik.gov.tr's TLS
  # handshake only completes under a relaxed OpenSSL SECLEVEL (docker/kikproxy-openssl.cnf),
  # kept in its own process so that relaxation never touches the app's own outbound calls —
  # see LawClientsHttp.cs / KikProxyClient.cs. Stateless, no DB, not internet-facing beyond
  # the one gov.tr host it talks to.
  kikproxy:
    # A release pulls this image (KORKUT_VERSION in .env); a source checkout builds it.
    image: ghcr.io/bircex/korkut-kikproxy:${KORKUT_VERSION:-local}
    build:
      context: .
      dockerfile: docker/Dockerfile.kikproxy
      args:
        KORKUT_VERSION: ${KORKUT_VERSION:-local}
    restart: unless-stopped

  # The model gateway (github.com/bircex/llmr): holds the AI provider keys, which models are
  # enabled and which names route to them, and records usage and cost. Korkut calls it at
  # http://llmr:8080 with LLMR_TOKEN; nothing is published, so nothing else can reach it.
  # Pinned by digest: llmr publishes only :latest.
  llmr:
    image: ghcr.io/bircex/llmr@sha256:886fa0409577272b15d8e49dd6a9ec0417ebb2c7411b93dcb4e5f002f8755c02
    environment:
      LLMR_MASTER_KEY: ${LLMR_MASTER_KEY:?LLMR_MASTER_KEY is not set; run ./install.sh}
      LLMR_TOKEN: ${LLMR_TOKEN:?LLMR_TOKEN is not set; run ./install.sh}
    volumes:
      - llmr-data:/var/lib/llmr
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  pgdata:
  # Uploaded documents. Back this up together with pgdata: the database names every object here.
  objects:
  # Generated KORKUT_SECRET / KORKUT_TOTP_KEY. Losing it signs everyone out and voids 2FA setups.
  secrets:
  # The gateway's providers, models, routes and usage; provider keys sealed with LLMR_MASTER_KEY.
  llmr-data:
