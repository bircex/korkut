# SPA host + API reverse proxy. The React app fetches same-origin /api/... paths (including the
# Google OAuth start/callback), so everything under /api is forwarded to the backend container;
# every other path falls back to index.html for client-side routing (/sohbet/12, /ayarlar/...).

upstream korkut_backend {
    server backend:8090;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Backend API + auth. Docker's embedded DNS resolves "backend" to the service container.
    location /api/ {
        proxy_pass http://korkut_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE/streaming chat responses must not be buffered.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Long-cache fingerprinted assets; Vite hashes filenames so this is safe.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — any unknown path serves the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
