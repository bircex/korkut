# Reverse proxy in front of Mattermost. Two jobs:
#  1. Inject our brand stylesheet (free white-label: hide the Mattermost logo, show Cankar Hukuk).
#  2. The natural place for TLS termination later (SECURITY.md §1).
# Users hit nginx on :8065; Mattermost is internal-only.
worker_processes 1;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  client_max_body_size 50M;

  upstream mattermost { server mattermost:8065; }

  server {
    listen 8065;
    server_name _;

    # Our brand stylesheet (served by nginx, same-origin so Mattermost's CSP allows it).
    location = /cankar-brand.css {
      alias /etc/nginx/branding/cankar-brand.css;
      default_type text/css;
      add_header Cache-Control "no-cache";
    }

    # WebSocket endpoint (realtime) — must upgrade the connection.
    location ~ /api/v[0-9]+/(users/)?websocket$ {
      proxy_pass http://mattermost;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 600s;
    }

    location / {
      proxy_pass http://mattermost;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Disable upstream gzip so sub_filter can rewrite the HTML.
      proxy_set_header Accept-Encoding "";
      # Inject our brand stylesheet into every HTML page.
      sub_filter '</head>' '<link rel="stylesheet" href="/cankar-brand.css?v=3"></head>';
      sub_filter_once on;
      sub_filter_types text/html;
    }
  }
}
