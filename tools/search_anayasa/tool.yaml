name: search_anayasa
description: >
  Search Anayasa Mahkemesi (Constitutional Court) decisions on the official anayasa.gov.tr
  bilgi bankası — both norm control (norm denetimi) and individual application (bireysel
  başvuru). Returns decision metadata (id, title, type, date, url). No key required.
requires_key: null
parameters:
  query:
    type: string
    required: true
    description: Search phrase, matched as a keyword against the decision corpus.
  basvuru_turu:
    type: string
    required: false
    default: norm
    description: >
      Which corpus to search: "norm" for norm control (norm denetimi) or "bireysel" for
      individual applications (bireysel başvuru).
  limit:
    type: integer
    required: false
    default: 10
    description: Maximum results returned for this page.
  page:
    type: integer
    required: false
    default: 1
    description: 1-indexed page number.
