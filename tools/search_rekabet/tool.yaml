name: search_rekabet
description: >
  Search Rekabet Kurumu (Turkish Competition Authority / Rekabet Kurumu) decisions via the
  official rekabet.gov.tr portal. Covers merger/acquisition reviews, competition
  infringements, negative clearance/exemption, privatization, and other decisions. The portal
  has no JSON API or key: results are parsed from the public search HTML. Returns decision
  metadata (id, title, type, date, url); use the url to read the full decision.
requires_key: null
parameters:
  query:
    type: string
    required: true
    description: >
      Free-text title search (maps to the portal's "sayfaAdi" field). Plain words; no
      operators, wildcards, or regex.
  karar_turu:
    type: string
    required: false
    default: ""
    description: >
      Optional decision-type filter. One of: birlesme_devralma (merger & acquisition), diger
      (other), menfi_tespit_muafiyet (negative clearance & exemption), ozellestirme
      (privatization), rekabet_ihlali (competition infringement). Empty = all types.
  limit:
    type: integer
    required: false
    default: 10
    description: Results per page (1-10; the portal serves 10 per page).
  page:
    type: integer
    required: false
    default: 1
    description: 1-indexed page number.
