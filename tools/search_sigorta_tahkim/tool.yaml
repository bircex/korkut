name: search_sigorta_tahkim
description: >
  Search Sigorta Tahkim Komisyonu (Insurance Arbitration Commission) decisions. The commission
  publishes quarterly PDF journals ("Hakem Karar Dergisi") on sigortatahkim.org with no searchable
  API, so discovery uses the Tavily Search API restricted to the commission domain. Each result's
  id is a journal issue number — pass it to fetch_sigorta_tahkim to read the issue, or to
  search_within_sigorta_tahkim to find a keyword inside it. Requires a Tavily API key
  (TAVILY_API_KEY).
requires_key: TAVILY_API_KEY
parameters:
  query:
    type: string
    required: true
    description: Free-text keywords (Turkish).
  limit:
    type: integer
    required: false
    default: 10
    description: Maximum results (1-20). Tavily has no real pagination; pages > 1 may be empty.
  page:
    type: integer
    required: false
    default: 1
    description: 1-indexed page number (kept for envelope consistency).
