name: search_yargitay
description: >
  Search Yargıtay (Court of Cassation / Yargıtay) decisions — Turkey's highest court for
  civil and criminal matters — via the Bedesten API. Returns decision metadata (documentId,
  chamber, case/decision number, date). Use fetch_decision with a documentId for full text.
requires_key: null
parameters:
  query:
    type: string
    required: true
    description: >
      Search phrase. Supports "exact phrase" (double quotes), +required, -exclude, and
      AND/OR/NOT operators. No wildcards or regex.
  limit:
    type: integer
    required: false
    default: 10
    description: Results per page (1-10).
  page:
    type: integer
    required: false
    default: 1
    description: 1-indexed page number.
  chamber:
    type: string
    required: false
    description: Optional chamber filter, e.g. "1. Hukuk Dairesi" or "Ceza Genel Kurulu".
  date_start:
    type: string
    required: false
    description: Optional start date, YYYY-MM-DD (or full ISO 8601).
  date_end:
    type: string
    required: false
    description: Optional end date, YYYY-MM-DD (or full ISO 8601).
