name: search_mevzuat
description: >
  Search Turkish legislation (mevzuat) — laws, decree-laws, statutes, regulations,
  Presidential decrees/decisions/circulars, communiqués — via the Ministry of
  Justice (UYAP Mevzuat) Bedesten API. Returns legislation metadata (id, title,
  type, number, Official Gazette date, url). No API key required.
requires_key: null
parameters:
  query:
    type: string
    required: true
    description: >
      Title keyword(s) to match against legislation names (e.g. "türk borçlar kanunu").
  limit:
    type: integer
    required: false
    default: 10
    description: Results per page (1-50).
  page:
    type: integer
    required: false
    default: 1
    description: 1-indexed page number.
  mevzuat_turu:
    type: string
    required: false
    default: ""
    description: >
      Optional legislation type filter. One of KANUN, KHK, TUZUK, YONETMELIK,
      CB_KARARNAME, CB_YONETMELIK, CB_KARAR, CB_GENELGE, KKY, UY, TEBLIGLER, MULGA.
      Comma-separated values filter by several types at once.
