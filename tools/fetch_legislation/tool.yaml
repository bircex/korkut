name: fetch_legislation
description: >
  Fetch the full text of a piece of Turkish legislation (mevzuat) as Markdown via the Bedesten
  API. Works for any legislation type (kanun, KHK, tüzük, yönetmelik, Cumhurbaşkanlığı
  kararname/karar/genelge, tebliğ). The legislation_id comes from a search_mevzuat result; pass an
  optional article_id to fetch a single article instead of the whole text. Use this to read or
  verify the actual wording of legislation before relying on it.
requires_key: null
parameters:
  legislation_id:
    type: string
    required: true
    description: The legislation id (`id`) returned by a search_mevzuat result.
  article_id:
    type: string
    required: false
    description: Optional article id; when given, only that article's text is fetched.
