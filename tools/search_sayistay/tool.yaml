name: search_sayistay
description: >
  Search Sayıştay (Court of Accounts / Sayıştay) decisions — Turkey's supreme audit
  institution — via the official sayistay.gov.tr portal. Covers three decision types:
  Genel Kurul (General Assembly), Temyiz Kurulu (Appeals Board), and Daire (Chamber).
  Returns decision metadata (id, title, decision type, date, detail URL). No API key.
requires_key: null
parameters:
  query:
    type: string
    required: true
    description: Free-text search phrase.
  karar_turu:
    type: string
    required: false
    default: genel_kurul
    description: >
      Decision type. One of "genel_kurul" (General Assembly), "temyiz_kurulu"
      (Appeals Board), or "daire" (Chamber).
  limit:
    type: integer
    required: false
    default: 10
    description: Results per page (1-10).
  page:
    type: integer
    required: false
    default: 1
    description: 1-indexed page number.
