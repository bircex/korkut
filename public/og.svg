<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Korkut">
  <rect width="1200" height="630" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#e6e7ea"/>
  <!-- subtle dotted texture top-right -->
  <g fill="#eef0f2">
    <circle cx="980" cy="90" r="3"/><circle cx="1030" cy="90" r="3"/><circle cx="1080" cy="90" r="3"/><circle cx="1130" cy="90" r="3"/>
    <circle cx="980" cy="140" r="3"/><circle cx="1030" cy="140" r="3"/><circle cx="1080" cy="140" r="3"/><circle cx="1130" cy="140" r="3"/>
    <circle cx="980" cy="190" r="3"/><circle cx="1030" cy="190" r="3"/><circle cx="1080" cy="190" r="3"/><circle cx="1130" cy="190" r="3"/>
  </g>

  <!-- logo mark -->
  <g transform="translate(90 96)">
    <rect width="88" height="88" rx="20" fill="#0a0a0a"/>
    <text x="44" y="60" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="800" fill="#ffffff" text-anchor="middle">K</text>
  </g>
  <text x="200" y="156" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800" fill="#0a0a0a">Korkut</text>

  <!-- headline -->
  <text x="90" y="320" font-family="Inter, Arial, sans-serif" font-size="66" font-weight="800" fill="#0a0a0a" letter-spacing="-1.5">Avukatın her işi,</text>
  <text x="90" y="398" font-family="Inter, Arial, sans-serif" font-size="66" font-weight="800" fill="#0a0a0a" letter-spacing="-1.5">tek asistanda</text>
  <rect x="90" y="410" width="352" height="6" rx="3" fill="#0a0a0a"/>

  <!-- subline -->
  <text x="92" y="466" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="500" fill="#62666d">Açık kaynak · Kendi sunucunuzda · Veriler ofiste kalır</text>

  <!-- badges -->
  <g font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600">
    <rect x="90" y="520" width="150" height="52" rx="26" fill="#f0f1f2"/>
    <text x="165" y="554" fill="#0a0a0a" text-anchor="middle">MIT lisansı</text>
    <rect x="256" y="520" width="200" height="52" rx="26" fill="#f0f1f2"/>
    <text x="356" y="554" fill="#0a0a0a" text-anchor="middle">Self-hosted</text>
    <rect x="472" y="520" width="190" height="52" rx="26" fill="#f0f1f2"/>
    <text x="567" y="554" fill="#0a0a0a" text-anchor="middle">Telemetri yok</text>
  </g>
</svg>
