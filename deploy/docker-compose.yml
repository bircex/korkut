# Local trial: Korkut web app in one container (self-hosted chat UI + brain + local OCR).
#   docker compose -f deploy/docker-compose.yml up -d --build   → http://localhost:8090
# Data (SQLite DB) lives in ./data at the repo root, so it survives container rebuilds —
# accounts and 2FA enrolments are preserved across restarts. Everything stays on this machine;
# only the redacted, cloud-bound traffic ever leaves.
# (Production: swap KORKUT_DB_URL for a Postgres instance.)
services:
  korkut:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      KORKUT_HOST: "0.0.0.0"
      KORKUT_PORT: "8090"
      KORKUT_DB_URL: "sqlite:////app/data/korkut.db"
    ports:
      - "8090:8090"
    volumes:
      - ../data:/app/data
      # Serve the locally-built SPA (frontend/ `npm run build` output) directly, so UI changes
      # show after a plain `docker compose up -d korkut` — no image rebuild needed.
      - ../backend/src/korkut/api/static:/app/backend/src/korkut/api/static

  # Scheduled-send worker: flushes due outbound messages (e.g. "X tarihinde gönder") every minute.
  # Shares the same image + DB volume as the web app. (Production: one dispatcher per DB.)
  dispatcher:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      KORKUT_DB_URL: "sqlite:////app/data/korkut.db"
    volumes:
      - ../data:/app/data
    command: sh -c "while true; do python -m korkut.api.dispatcher; sleep 60; done"

  # Two-way integrations runner: polls every enabled office connector (Telegram/WhatsApp/e-mail)
  # and answers inbound messages through the same brain as the web chat. Same image + DB volume.
  # A short loop keeps Telegram/WhatsApp responsive; e-mail polling is naturally slower.
  integrations:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      KORKUT_DB_URL: "sqlite:////app/data/korkut.db"
    volumes:
      - ../data:/app/data
    command: sh -c "while true; do python -m korkut.integrations.runner; sleep 5; done"

  # WhatsApp Web (Baileys) sidecar — owns the WhatsApp session the `whatsapp` connector talks to.
  # Off by default (needs a one-time QR pairing). To use WhatsApp:
  #   1) set KORKUT_WA_TOKEN in ../.env (same value as the office's whatsapp channel config)
  #   2) docker compose -f deploy/docker-compose.yml --profile whatsapp up -d whatsapp-sidecar
  #   3) scan the QR shown in `docker compose logs -f whatsapp-sidecar`
  # It shares the `integrations` network namespace, so the connector reaches it at 127.0.0.1:8099.
  whatsapp-sidecar:
    profiles: ["whatsapp"]
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app/sidecar
    env_file: ../.env
    environment:
      KORKUT_WA_PORT: "8099"
      KORKUT_WA_AUTH_DIR: "/data/wa-auth"
    volumes:
      - ../backend/src/korkut/integrations/sidecar:/app/sidecar
      - ../data:/data
    network_mode: "service:integrations"
    command: sh -c "npm install --no-audit --no-fund && node index.js"
