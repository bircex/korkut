# Local trial: Korkut web app in one container (self-hosted chat UI + brain + local OCR).
#   docker compose up -d --build   → http://localhost:8090
# Data (SQLite DB, coverage cache, uploads-in-memory only) lives in ./data on the host, so it
# survives container rebuilds — accounts and 2FA enrolments are preserved across restarts.
# Everything stays on this machine; only the redacted, cloud-bound traffic ever leaves.
# (Production: swap KORKUT_DB_URL for a Postgres instance.)
services:
  korkut:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      KORKUT_HOST: "0.0.0.0"
      KORKUT_PORT: "8090"
      KORKUT_DB_URL: "sqlite:////app/data/korkut.db"
    ports:
      - "8090:8090"
    volumes:
      - ./data:/app/data
