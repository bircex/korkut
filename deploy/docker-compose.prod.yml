# Production stack: pulls the published image from GHCR and runs Korkut against Postgres.
#
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d
#
# Put Korkut behind a TLS-terminating reverse proxy (nginx/Caddy/Traefik); it listens on
# 127.0.0.1:8080 here, with secure cookies and X-Forwarded-For trust enabled. See docs/DEPLOYMENT.md.
x-korkut: &korkut
  image: ${KORKUT_IMAGE:-ghcr.io/recepkizilarslan/korkut-backend:latest}
  restart: unless-stopped
  env_file: ../.env
  environment:
    KORKUT_DB_URL: ${KORKUT_DB_URL:-postgresql+psycopg://korkut:${POSTGRES_PASSWORD:-korkut}@db:5432/korkut}
    KORKUT_REDIS_URL: ${KORKUT_REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379/0}
    KORKUT_HOST: "0.0.0.0"
    KORKUT_PORT: "8080"
    KORKUT_SECURE_COOKIES: "1"
    KORKUT_TRUST_PROXY: "1"
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: korkut
      POSTGRES_DB: korkut
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-korkut}
    volumes:
      - korkut-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U korkut -d korkut"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    # $$ escapes compose interpolation so the password is read from the container env at runtime
    # (never rendered into the compose command, so it doesn't leak via `docker inspect`).
    command: sh -c 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --save "60 1"'
    volumes:
      - korkut-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  korkut:
    <<: *korkut
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      # TODO(phase1): swap to a dedicated /api/health that also checks DB + RLS role. For now `/`
      # (the SPA index) is an unauthenticated 200 liveness probe.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/').status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  dispatcher:
    <<: *korkut
    command: sh -c "while true; do python -m korkut.api.dispatcher; sleep 60; done"

  # Single shared Telegram/WhatsApp/e-mail poller for ALL offices. It resolves each inbound
  # message to its office via integration_links before answering (see docs/SAAS_ARCHITECTURE.md §7).
  integrations:
    <<: *korkut
    command: sh -c "while true; do python -m korkut.integrations.runner; sleep 5; done"

volumes:
  korkut-db:
  korkut-redis:
