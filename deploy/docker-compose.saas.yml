# Multi-tenant SaaS stack: Postgres + fail-closed RLS, an admin bootstrap, and the web app running
# as a NON-superuser role so RLS is actually enforced.
#   docker compose -f deploy/docker-compose.saas.yml up -d --build   → http://localhost:8090
# The `bootstrap` one-shot builds the schema + RLS + resolvers and the app role, then the app + the
# workers connect as that app role. Google OIDC must be configured (GOOGLE_CLIENT_ID/SECRET/
# REDIRECT_URI in ../.env) to sign in; until then the app is up and /api/auth/google/start is 503.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: korkut
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d korkut"]
      interval: 3s
      timeout: 3s
      retries: 30

  # One-shot: builds schema + RLS + resolvers as admin, creates the non-superuser app role. Exits 0.
  bootstrap:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    environment:
      KORKUT_ADMIN_DB_URL: "postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/korkut"
      KORKUT_APP_DB_ROLE: "korkut_app"
      KORKUT_APP_DB_PASSWORD: "${KORKUT_APP_DB_PASSWORD:-korkut_app_pw}"
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["python", "-m", "korkut.api.bootstrap"]
    restart: "no"

  korkut:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      KORKUT_HOST: "0.0.0.0"
      KORKUT_PORT: "8090"
      KORKUT_DB_URL: "postgresql+psycopg://korkut_app:${KORKUT_APP_DB_PASSWORD:-korkut_app_pw}@db:5432/korkut"
    ports:
      - "8090:8090"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    volumes:
      # Serve the committed SPA directly, so a refreshed UI shows without an image rebuild.
      - ../backend/src/korkut/api/static:/app/backend/src/korkut/api/static

volumes:
  pgdata:
