version: 2
updates:
  # .NET dependencies (dotnet/Directory.Packages.props — central package management)
  - package-ecosystem: nuget
    directory: /dotnet
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dotnet-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies, dotnet]
    commit-message:
      prefix: "nuget"

  # GitHub Actions used in workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
    commit-message:
      prefix: "ci"

  # Base images in the .NET Dockerfiles
  - package-ecosystem: docker
    directory: /dotnet/docker
    schedule:
      interval: weekly
    labels: [dependencies, docker]
    commit-message:
      prefix: "docker"
