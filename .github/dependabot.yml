version: 2
updates:
  # Python dependencies (backend/pyproject.toml)
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies, python]
    commit-message:
      prefix: "pip"

  # Frontend dependencies (frontend/package.json)
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies, frontend]
    commit-message:
      prefix: "npm"

  # GitHub Actions used in workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
    commit-message:
      prefix: "ci"

  # Base images in the deploy Dockerfile
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    labels: [dependencies, docker]
    commit-message:
      prefix: "docker"

  # WhatsApp Web (Baileys) sidecar dependencies
  - package-ecosystem: npm
    directory: /backend/src/korkut/integrations/sidecar
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      sidecar-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies, integrations]
    commit-message:
      prefix: "npm"
