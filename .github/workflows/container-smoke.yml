name: Container smoke

# Builds the hardened host images and runs the container smoke test (non-root,
# read-only filesystem, health, graceful SIGTERM shutdown). Path-aware: runs
# when the Docker packaging changes.

on:
  pull_request:
    branches: [main]
    paths:
      - "docker/**"
      - "global.json"
      - ".github/workflows/container-smoke.yml"

permissions:
  contents: read

concurrency:
  group: container-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Container smoke test
        run: bash docker/smoke-test.sh
