name: Build & Deploy

# Builds every .NET host image (matrix over docker/Dockerfile.*) → Artifact Registry via keyless
# WIF, then fires the korkut-pipelines deploy. Mirrors korkut-admin/.github/workflows/build.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  REG: europe-west3-docker.pkg.dev/korkutai/korkut
  WIF: projects/339072634095/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  SA: korkut-cicd@korkutai.iam.gserviceaccount.com

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [api, agent, worker, knowledge, ocr, gateway, migrator]
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF }}
          service_account: ${{ env.SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker europe-west3-docker.pkg.dev --quiet
      - name: Build & push korkut-${{ matrix.host }}
        run: |
          IMG="$REG/korkut-${{ matrix.host }}"
          docker build -f docker/Dockerfile.${{ matrix.host }} \
            -t "$IMG:${{ github.sha }}" -t "$IMG:latest" .
          docker push "$IMG:${{ github.sha }}"
          docker push "$IMG:latest"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy
        env:
          GH_TOKEN: ${{ secrets.PIPELINES_DISPATCH_TOKEN }}
        run: |
          gh api repos/recepkizilarslan/korkut-pipelines/dispatches \
            -f event_type=deploy -f 'client_payload[tag]=latest'
