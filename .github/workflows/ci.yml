name: CI

# Build + architecture + smoke tests for the .NET solution on every PR into main
# that touches the .NET sources. Path-aware so it stays fast. Read-only
# permissions; no secrets used.

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "Korkut.slnx"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - "dotnet-tools.json"
      - ".editorconfig"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: dotnet-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: Restore, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Korkut.slnx

      - name: Build (warnings-as-errors, analyzers, nullable)
        run: dotnet build Korkut.slnx -c Release --no-restore

      - name: Test (architecture + smoke + unit)
        run: dotnet test Korkut.slnx -c Release --no-build --verbosity normal
