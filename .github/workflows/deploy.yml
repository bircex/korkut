name: Deploy

# Continuous deploy to the single VPS. Runs only AFTER the CI workflow succeeds on main, so broken
# code is never shipped. Builds the image, pushes it to GHCR, then SSHes into the VPS and rolls the
# compose stack to the freshly built image. See docs/SAAS_ARCHITECTURE.md §13.
#
# Required repository secrets:
#   VPS_HOST       - server hostname/IP
#   VPS_USER       - SSH user
#   VPS_SSH_KEY    - private SSH key (PEM) authorized on the VPS
#   VPS_DEPLOY_PATH- dir on the VPS holding .env (e.g. /opt/korkut); compose file is shipped here
#   GHCR_PAT       - a PAT with read:packages, used by the VPS to pull the private image
# GHCR push uses the built-in GITHUB_TOKEN (packages: write below).

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    # Deploy ONLY a green CI run that was a direct push to main. This blocks a fork PR's CI run
    # (workflow_run fires for PR CI too) from ever triggering a production deploy of unreviewed code.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_branch == 'main' &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve image ref
        id: meta
        run: |
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "image=ghcr.io/${{ github.repository_owner }}/korkut-backend:${sha}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ghcr.io/${{ github.repository_owner }}/korkut-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Ship the current compose file to the VPS (never touches the VPS .env, which holds secrets).
      - name: Copy compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy/docker-compose.prod.yml"
          target: ${{ secrets.VPS_DEPLOY_PATH }}
          overwrite: true

      - name: Roll the stack to the new image
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DEPLOY_PATH,IMAGE,GHCR_PAT,GHCR_USER
          script_stop: true
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export KORKUT_IMAGE="$IMAGE"
            docker compose -f deploy/docker-compose.prod.yml --env-file .env pull
            docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d
            docker image prune -f
        env:
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          IMAGE: ${{ needs.build-push.outputs.image }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USER: ${{ github.repository_owner }}
