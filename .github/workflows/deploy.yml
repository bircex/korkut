name: Deploy

# Builds the image and hands off to korkut-pipelines, which owns the VPS/edge and rolls the stack.
# Runs only AFTER the CI workflow succeeds on main, so broken code is never shipped. This repo NO
# LONGER SSHes into the VPS — it builds+pushes to GHCR and fires a repository_dispatch at
# korkut-pipelines with the new image ref. See docs/SAAS_ARCHITECTURE.md §13.
#
# Required repository secrets:
#   PIPELINES_DISPATCH_TOKEN - PAT with `repo` scope on recepkizilarslan/korkut-pipelines,
#                              used to trigger its Deploy workflow.
# GHCR push uses the built-in GITHUB_TOKEN (packages: write below).

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    # Deploy ONLY a green CI run that was a direct push to main. This blocks a fork PR's CI run
    # (workflow_run fires for PR CI too) from ever triggering a production deploy of unreviewed code.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_branch == 'main' &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve image ref
        id: meta
        run: |
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "image=ghcr.io/${{ github.repository_owner }}/korkut-backend:${sha}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ghcr.io/${{ github.repository_owner }}/korkut-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trigger-pipelines:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      # Hand off to korkut-pipelines, which SSHes into the VPS and rolls the stack to this image.
      - name: Dispatch deploy to korkut-pipelines
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PIPELINES_DISPATCH_TOKEN }}
          repository: ${{ github.repository_owner }}/korkut-pipelines
          event-type: backend-image
          client-payload: '{"image": "${{ needs.build-push.outputs.image }}"}'
