name: Release

# Manual only — the repository owner runs this from the Actions tab. There is no automatic
# (push/tag) trigger by design.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "CalVer release version (YYYY.M.PATCH), e.g. 2026.7.0"
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 1. Full quality gate (mirror CI) before anything is published.
      - name: Install backend
        run: pip install -e "backend[app,dev]"

      - name: Backend lint, types, tests
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .
          mypy
          pytest

      - name: Frontend lint and build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

      # 2. Stamp the CalVer version into both manifests + the changelog.
      - name: Set version
        run: python scripts/bump_version.py "${{ inputs.version }}"

      - name: Promote changelog
        run: python scripts/release_changelog.py "${{ inputs.version }}" "$(date -u +%F)"

      # 3. Commit, tag and push.
      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/pyproject.toml frontend/package.json CHANGELOG.md
          git commit -m "Release v${{ inputs.version }}"
          git tag "v${{ inputs.version }}"
          git push origin HEAD --follow-tags

      # 4. Build and publish the image to GHCR.
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/korkut:v${{ inputs.version }}
            ghcr.io/${{ github.repository_owner }}/korkut:latest

      # 5. Scan the published image (report-only; does not block the release).
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/korkut:v${{ inputs.version }}
          format: table
          ignore-unfixed: true
          exit-code: "0"

      # 6. Cut the GitHub Release with auto-generated notes.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          generate_release_notes: true
          body: |
            Container image: `ghcr.io/${{ github.repository_owner }}/korkut:v${{ inputs.version }}`
