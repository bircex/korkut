name: Migration CI

# KDM-032 — required quality gates for the public website. On every PR into
# dotnet-migration: base-branch policy, secret scan, type check, build, SCA, a
# security-headers gate, a build-once release manifest, and a Playwright + axe
# smoke (routes/links, CSP, no external assets, responsive, accessibility).

on:
  pull_request:
    branches: [dotnet-migration]

permissions:
  contents: read

concurrency:
  group: migration-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Branch & secret policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Base-branch policy
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: bash ci/lib/check-migration-pr.sh --base "$BASE_REF" --head "$HEAD_REF"
      - name: Secret scan
        run: bash ci/lib/secret-scan.sh .

  build:
    name: Check, build, SCA, headers, manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Type check
        run: npm run check
      - name: Security-headers gate
        run: npm run check:headers
      - name: Build
        run: npm run build
      - name: SCA (npm audit)
        run: npm audit --audit-level=high
      - name: Build-once release manifest
        run: npm run manifest
      - name: Upload deploy artifact (+ manifest)
        uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: dist/
          retention-days: 7

  e2e:
    name: Playwright + axe (routes, CSP, responsive)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run e2e
        run: npm run test:e2e
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
