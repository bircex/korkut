name: Migration CI

# KDM-029 — required quality gates for the Korkut UI migration. Runs on every PR into
# dotnet-migration: base-branch policy, secret scan, lint/typecheck/unit+component,
# build, SCA, and a Playwright + axe accessibility/responsive e2e. Critical/serious
# axe violations and keyboard blockers fail the build.

on:
  pull_request:
    branches: [dotnet-migration]

permissions:
  contents: read

concurrency:
  group: migration-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Branch & secret policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Base-branch policy
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: bash ci/lib/check-migration-pr.sh --base "$BASE_REF" --head "$HEAD_REF"
      - name: Secret scan
        run: bash ci/lib/secret-scan.sh .

  quality:
    name: Lint, typecheck, unit/component, build, SCA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit + component tests (Vitest + axe)
        run: npm run test
      - name: Build
        run: npm run build
      - name: SCA (npm audit)
        run: npm audit --audit-level=high

  e2e:
    name: Playwright + axe (responsive, WCAG 2.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run e2e (auth, navigation, form; axe + keyboard + reflow)
        run: npm run test:e2e
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
