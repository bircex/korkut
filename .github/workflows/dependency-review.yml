name: Dependency review

# Flags vulnerable or disallowed dependencies introduced by a pull request.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    # Dependency review needs the dependency graph + GHAS, which is free on public repos. Skip it
    # while the repository is private so the check doesn't hard-fail; it activates once public.
    if: ${{ github.event.repository.private == false }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependency review
        # Advisory, not a hard gate: if the dependency graph isn't provisioned yet (e.g. right
        # after the repo is made public) the action errors out — don't let that block the PR.
        # Requires "Dependency graph" enabled under Settings → Code security.
        continue-on-error: true
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
